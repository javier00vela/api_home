services:
  app:
    build: .
    container_name: api_home
    restart: unless-stopped
    init: true
    ports:
      - "8015:8000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    volumes:
      - .:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
